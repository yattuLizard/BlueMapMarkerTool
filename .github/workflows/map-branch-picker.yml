name: Map Branch Picker Checks

on:
  push:
    branches:
      - feature/map-branch-picker

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS syntax
        run: |
          node --check src/main/resources/assets/bluemap_marker_tool/area-draw.js
          node --check src/main/resources/assets/bluemap_marker_tool/fairway-network.js
          node --check src/main/resources/assets/bluemap_marker_tool/fairway-geometry.js
      - name: Test geometry, graph, and editor interaction
        run: |
          node tests/fairway-geometry.test.cjs
          node tests/fairway-network.test.cjs
          node tests/editor-smoke.cjs
      - name: Build mod
        run: ./gradlew build --no-daemon
